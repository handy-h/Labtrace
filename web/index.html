<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <base href="/web/" />
        <link rel="icon" type="image/svg+xml" href="favicon.svg" />
        <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
        <title>溯源健康 LabTrace</title>
        <!-- Tailwind CSS Play CDN 不支持 SRI (动态加载脚本) - 存在供应链风险 -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                primary: { 
                  50: '#F0FDFA', 
                  100: '#CCFBF1', 
                  200: '#99F6E4', 
                  300: '#5EEAD4', 
                  400: '#2DD4BF', 
                  500: '#14B8A6', 
                  600: '#0D9488', 
                  700: '#0F766E', 
                  800: '#115E59', 
                  900: '#134E4A' 
                },
              },
            },
          },
        }
        </script>
        <!-- Vue 3.5.13 - SRI sha384 已配置，请定期验证 -->
        <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js" integrity="sha384-W/1Fp/LgAYO/oTn9Gs+PbeWuMuq1eQCnUMPCeg8POmMYchhzxctjEqtbiCIxDOON" crossorigin="anonymous"></script>
        <!-- ECharts 5.6.0 - SRI sha384 已配置，请定期验证 -->
        <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js" integrity="sha384-pPi0zxBAoDu6+JXW/C68UZLvBUUtU+7zonhif43rqj7pxsGyqyqzcian2Rj37Rss" crossorigin="anonymous"></script>
        <!-- pdf.js 3.11.174 - SRI sha384 已配置，请定期验证 -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" integrity="sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+1UUDCG6e" crossorigin="anonymous"></script>
        <!-- pdf.worker 通过 URL 赋值加载，无法使用 SRI -->
        <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
        <link rel="stylesheet" href="css/app.css" />
    </head>
    <body class="font-sans" style="background: var(--color-bg); color: var(--color-text)">
        <div id="app">
            <!-- 顶栏 -->
            <header
                class="h-14 bg-slate-800 text-white flex items-center px-4 select-none"
            >
                <div class="flex items-center gap-3 min-w-0">
                    <span class="text-xl font-bold tracking-wide text-blue-400"
                        >LabTrace</span
                    >
                    <span class="text-sm text-slate-400 hidden sm:inline"
                        >溯源健康</span
                    >
                </div>
                <div class="flex-1 flex justify-center px-8 relative">
                    <input
                        type="text"
                        v-model="globalSearchQuery"
                        placeholder="全局搜索
                        class="w-full max-w-md px-3 py-1.5 rounded bg-slate-700 text-white placeholder-slate-400 text-sm border border-slate-600 focus:outline-none focus:border-blue-500"
                    />
                    <search-dropdown
                        :query="globalSearchQuery"
                        @navigate="onSearchNavigate"
                    ></search-dropdown>
                </div>
                <div class="flex items-center gap-4 text-sm text-slate-300">
                    <subject-selector
                        :subjects="allSubjects"
                        :current-id="currentSubjectId"
                        :current-name="currentSubjectName"
                        @change="onSubjectChange"
                    ></subject-selector>
                    <span class="text-slate-600">|</span>
                    <a href="/api.html" target="_blank" class="hover:text-white">API</a>
                </div>
            </header>

            <div class="flex" style="height: calc(100vh - 3.5rem)">
                <!-- 侧栏导航 -->
                <nav
                    class="w-56 bg-slate-900 text-slate-300 flex flex-col select-none"
                >
                    <div class="flex-1 py-4">
                        <a
                            v-for="item in navItems"
                            :key="item.hash"
                            :href="'#' + item.hash"
                            @click="currentView = item.hash"
                            :class="['flex items-center gap-3 px-4 py-2.5 text-sm transition-colors',
                    currentView === item.hash ? 'bg-slate-700 text-white border-r-2 border-blue-400' : 'hover:bg-slate-800 hover:text-white']"
                        >
                            <span class="w-5 text-center">{{ item.icon }}</span>
                            <span>{{ item.label }}</span>
                        </a>
                    </div>
                    <div
                        class="px-4 py-3 text-xs text-slate-500 border-t border-slate-800"
                    >
                        v{{ appVersion }}
                    </div>
                </nav>

                <!-- 主内�?-->
                <main class="flex-1 overflow-auto">
                    <component
                        :is="currentComponent"
                        :key="currentView"
                    ></component>
                </main>
            </div>
        </div>

        <!-- CDN 加载失败检测与回退 -->
        <script>
        (function() {
          var missing = [];
          // 等待一小段时间让 CDN 脚本加载
          setTimeout(function() {
            if (typeof Vue === 'undefined') missing.push('Vue 3');
            if (typeof echarts === 'undefined') missing.push('ECharts');
            if (typeof pdfjsLib === 'undefined') missing.push('pdf.js');
            if (missing.length) {
              var el = document.createElement('div');
              el.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c53030;color:#fff;padding:8px 16px;text-align:center;font-size:14px;z-index:9999';
              el.textContent = '\u26A0\uFE0F CDN \u52A0\u8F7D\u5931\u8D25: ' + missing.join(', ') + '\uFF0C\u8BF7\u68C0\u67E5\u7F51\u7EDC\u8FDE\u63A5';
              document.body.insertBefore(el, document.body.firstChild);
            }
          }, 2000);
        })();
        </script>
        <script src="js/api.js?v=2"></script>
        <script src="js/utils.js?v=2"></script>
        <script src="js/components/data-table.js?v=2"></script>
        <script src="js/components/crud-modal.js?v=2"></script>
        <script src="js/components/search-dropdown.js?v=2"></script>
        <script src="js/components/subject-selector.js?v=2"></script>
        <script src="js/components/sparkline.js?v=2"></script>
        <script src="js/components/drilldown-popup.js?v=2"></script>
        <script src="js/views/dashboard.js?v=2"></script>
        <script src="js/views/ocr-mapping-wizard.js?v=2"></script>
        <script src="js/views/imaging-mapping-wizard.js?v=3"></script>
        <script src="js/views/ocr-import.js?v=4"></script>
        <script src="js/views/subjects.js?v=2"></script>
        <script src="js/views/test-items.js?v=2"></script>
        <script src="js/views/trend.js?v=3"></script>
        <script src="js/views/settings.js?v=2"></script>
        <script src="js/views/reports.js?v=1"></script>
        <script src="js/views/batch_import.js?v=2"></script>
        <script src="js/views/batch_import_imaging.js?v=2"></script>
        <script src="js/app.js?v=2"></script>
    </body>
</html>
